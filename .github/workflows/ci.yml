name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: flow, POSTGRES_USER: flow, POSTGRES_PASSWORD: flow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flow" --health-interval 5s --health-retries 10
    strategy:
      matrix:
        db: [sqlite, pgsql]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_pgsql, mbstring
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate the item bank (dry run)
        run: |
          cp .env.example .env && php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=TaxonomySeeder --force
          php artisan items:import --dry-run
      - name: Tests
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'flow' || ':memory:' }}
          DB_USERNAME: flow
          DB_PASSWORD: flow
        run: php artisan test
      - name: Code style
        run: vendor/bin/pint --test
        continue-on-error: true
